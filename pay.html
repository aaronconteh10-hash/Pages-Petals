<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header">
    <div class="header-left">
      <img src="image/logo.png" class="logo" alt="Pages & Petals Logo">
      <h1 class="site-title">Pages & Petals</h1>
    </div>

    <button id="menuBtn" class="menu-button">&#9776;</button>
  </header>

  <div id="sideMenu" class="side-menu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <div id="menuOverlay" class="menu-overlay"></div>

  <div class="payment-container">
    <h2>Payment Details</h2>

    <form id="paymentForm" class="payment-form">

      <div class="form-group">
        <label for="cardNumber">Card Number</label>
        <input id="cardNumber" type="text" placeholder="xxxx xxxx xxxx xxxx">
      </div>

      <div class="exp-row">
        <div>
          <label for="expMonth">Expiry Month</label>
          <select id="expMonth">
            <option value="">Month</option>
            <option value="1">01</option>
            <option value="2">02</option>
            <option value="3">03</option>
            <option value="4">04</option>
            <option value="5">05</option>
            <option value="6">06</option>
            <option value="7">07</option>
            <option value="8">08</option>
            <option value="9">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>

        <div>
          <label for="expYear">Expiry Year</label>
          <select id="expYear">
            <option value="">Year</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="cvv">CVV</label>
        <input id="cvv" type="text" placeholder="123">
      </div>

      <button class="btn-main" type="submit">Pay Now</button>

      <div id="message"></div>
    </form>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Pages & Petals Bookstore</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
